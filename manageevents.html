<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventually Planner | Manage Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-nav"></div>
<main id="main" class="container my-5">
 <h1 class="h2">Manage Events</h1>
 <p class="text-muted">A mock CRUD page. Changes are saved only in your browser and do not go to a server.</p>
 <div id="msg" class="alert d-none" role="status"></div>
 <div class="row g-4">
  <div class="col-lg-4">
   <form id="form" class="card card-body" novalidate>
    <h2 class="h5" id="formTitle">Create event</h2>
    <input type="hidden" id="eid">
    <div class="mb-2"><label class="form-label" for="name">Event name</label><input class="form-control" id="name" required maxlength="60"><div class="invalid-feedback">Enter a name.</div></div>
    <div class="mb-2"><label class="form-label" for="type">Type</label><select class="form-select" id="type"></select></div>
    <div class="mb-2"><label class="form-label" for="date">Date</label><input type="date" class="form-control" id="date" required><div class="invalid-feedback">Pick a date.</div></div>
    <div class="mb-2"><label class="form-label" for="venue">Venue</label><input class="form-control" id="venue" required maxlength="60"><div class="invalid-feedback">Enter a venue.</div></div>
    <div class="row g-2 mb-2">
     <div class="col"><label class="form-label" for="guests">Guests</label><input type="number" min="1" class="form-control" id="guests" required><div class="invalid-feedback">At least 1.</div></div>
     <div class="col"><label class="form-label" for="budget">Budget ($)</label><input type="number" min="0" class="form-control" id="budget" required><div class="invalid-feedback">Enter 0 or more.</div></div>
    </div>
    <div class="mb-3"><label class="form-label" for="status">Status</label><select class="form-select" id="status"></select></div>
    <div class="d-flex gap-2"><button class="btn btn-primary" type="submit" id="saveBtn">Add event</button><button class="btn btn-outline-secondary d-none" type="button" id="cancelBtn">Cancel edit</button></div>
   </form>
  </div>
  <div class="col-lg-8">
   <div class="d-flex flex-wrap gap-2 mb-3">
    <input class="form-control w-auto flex-grow-1" id="search" type="search" placeholder="Search by name or venue" aria-label="Search events">
    <select class="form-select w-auto" id="filter" aria-label="Filter by status"><option value="">All statuses</option></select>
    <button class="btn btn-outline-danger" id="resetBtn" type="button">Reset sample data</button>
   </div>
   <div class="table-responsive"><table class="table table-hover align-middle">
    <thead><tr><th>Event</th><th>Date</th><th>Venue</th><th class="text-end">Guests</th><th class="text-end">Budget</th><th>Status</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
    <tbody id="rows"></tbody></table></div>
   <p class="small text-muted" id="count"></p>
  </div>
 </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/manage.js"></script>
</body>
</html>
