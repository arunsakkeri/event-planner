<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventually Planner | Analytics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-nav"></div>
<main id="main" class="container my-5">
 <h1 class="h2">Event Analytics</h1>
 <p class="text-muted">Charts use the events on the Manage Events page, so any change you make there shows up here. The budget split is sample industry-style data.</p>
 <div class="row g-4">
  <div class="col-lg-6"><div class="card card-body"><h2 class="h5">Events by type</h2><div class="chart-box"><canvas id="typeChart" role="img" aria-label="Bar chart of event counts by type"></canvas></div></div></div>
  <div class="col-lg-6"><div class="card card-body"><h2 class="h5">Budget split by category</h2><div class="chart-box"><canvas id="budgetChart" role="img" aria-label="Doughnut chart of budget share by category"></canvas></div></div></div>
  <div class="col-12"><div class="card card-body"><h2 class="h5">Guests per month</h2><div class="chart-box"><canvas id="monthChart" role="img" aria-label="Line chart of total guests per month"></canvas></div></div></div>
 </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
